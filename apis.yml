aid: people-ai
name: People Ai
description: >-
  People.ai is an AI-powered revenue intelligence platform for sales leaders,
  RevOps, and CROs, now operating under the Backstory brand (people.ai redirects
  to backstory.ai). The platform automatically captures customer-facing activity
  (emails, meetings, calls, chats) from existing tools such as Salesforce,
  Microsoft Dynamics, Gmail, Outlook, Zoom, Teams, and Slack, then analyzes that
  activity against deal history to answer which deals are real, which are at risk,
  and what to do next. Core capabilities include deal-risk identification,
  pipeline visibility and touchpoint mapping, revenue forecasting validation, and
  automated CRM hygiene. People.ai is a portfolio company of Lightspeed Venture
  Partners. As of this enrichment pass the company exposes no public developer
  portal, API reference, or OpenAPI surface; integrations are delivered as managed
  native connectors rather than a documented public API.
